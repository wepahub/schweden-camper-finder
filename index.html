<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Schweden Camper Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo-mark">🌲</div>
      <div class="topbar-text">
        <h1>Schweden Camper Finder</h1>
        <p id="statusText">Ort suchen, GPS laden oder Karte verschieben.</p>
      </div>
    </div>
    <button id="locateBtn" class="icon-btn" title="Mein Standort" aria-label="Mein Standort">📍</button>
  </header>

  <div class="loading-bar" id="loadingBar"><div></div></div>

  <section class="searchbar">
    <form id="placeForm" autocomplete="off">
      <span class="search-icon">🔎</span>
      <input id="placeInput" type="search"
        placeholder="z. B. Uppsala, Karlskrona, Göteborg …"
        autocomplete="off" autocorrect="off" spellcheck="false">
      <button type="submit">Suchen</button>
    </form>
    <div id="placeResults" class="place-results hidden"></div>
  </section>

  <section class="controls">
    <div class="mode-row">
      <button class="mode-btn" data-mode="toilet">🚻 WC jetzt</button>
      <button class="mode-btn" data-mode="pause">🏖 Baden &amp; Pause</button>
      <button class="mode-btn" data-mode="evening">🌙 Abendplatz</button>
      <button class="mode-btn" data-mode="supply">💧 Versorgung</button>
    </div>
    <div class="chip-row">
      <button class="chip active" data-category="toilets"><span class="dot" style="background:#3b82f6"></span>🚻 WC</button>
      <button class="chip" data-category="water"><span class="dot" style="background:#06b6d4"></span>💧 Wasser</button>
      <button class="chip" data-category="camping"><span class="dot" style="background:#22c55e"></span>🏕 Stellplatz</button>
      <button class="chip" data-category="bathing"><span class="dot" style="background:#facc15"></span>🏖 Baden</button>
      <button class="chip" data-category="church"><span class="dot" style="background:#a78bfa"></span>⛪ Kirche</button>
      <button class="chip" data-category="parking"><span class="dot" style="background:#94a3b8"></span>🅿 Parkplatz</button>
      <button class="chip" data-category="picnic"><span class="dot" style="background:#fb923c"></span>🧺 Pause</button>
      <button class="chip" data-category="food"><span class="dot" style="background:#22c55e"></span>🛒 Lebensmittel</button>
      <button class="chip" data-category="museum"><span class="dot" style="background:#c084fc"></span>🏛 Museen</button>
      <button class="chip" data-category="hiking"><span class="dot" style="background:#84cc16"></span>🥾 Wanderwege</button>
    </div>
    <div class="action-row">
      <label for="radiusSelect">Radius</label>
      <select id="radiusSelect">
        <option value="1000">1 km</option>
        <option value="3000">3 km</option>
        <option value="5000" selected>5 km</option>
        <option value="10000">10 km</option>
        <option value="25000">25 km</option>
      </select>
      <button id="searchBtn" class="run-btn">🔍 Suchen</button>
    </div>
  </section>

  <main class="content">
    <section class="map-wrap">
      <div id="map"></div>
      <div class="crosshair" aria-hidden="true">
        <div class="crosshair-ring"><div class="crosshair-dot"></div></div>
      </div>
    </section>

    <aside class="results-panel">
      <div class="results-header">
        <div class="results-title">
          <h2>Ergebnisse <span id="resultCount" class="result-count"></span></h2>
          <p id="centerText">Suchzentrum: Kartenmitte</p>
        </div>
        <div class="results-tools">
          <button id="sortBtn" class="small-btn">↕ Nähe</button>
          <button id="showFavoritesBtn" class="small-btn fav-toggle">⭐ Favoriten</button>
        </div>
      </div>

      <div id="warningBox" class="warning hidden">
        ⚠️ Bei Kirchen, Parkplätzen und Rastplätzen immer lokale Beschilderung prüfen.
      </div>

      <div id="resultsList">
        <p class="empty">Noch keine Suche gestartet.</p>
      </div>
    </aside>
  </main>
</div>

<template id="resultItemTemplate">
  <article class="result-card">
    <div class="card-body">
      <div class="card-top">
        <div class="card-icon"></div>
        <div class="card-info">
          <strong class="result-title"></strong>
          <span class="result-meta"></span>
          <span class="result-badges"></span>
          <span class="result-extra"></span>
        </div>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-actions">
      <a class="maps-link" target="_blank" rel="noopener">📍 Google Maps</a>
      <a class="osm-link" target="_blank" rel="noopener">🗺 OSM</a>
      <button class="fav-btn">☆ Favorit</button>
      <button class="note-btn">✏️ Notiz</button>
      <button class="share-btn">↗ Teilen</button>
    </div>
  </article>
</template>

<dialog id="noteDialog" class="note-dialog">
  <form method="dialog">
    <div class="note-header">
      <p id="noteDialogLabel"></p>
    </div>
    <div class="note-body">
      <textarea id="noteDialogText" rows="4" placeholder="Notiz eingeben …"></textarea>
    </div>
    <div class="note-footer">
      <button value="cancel">Abbrechen</button>
      <button value="save" class="save-btn">Speichern</button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="js/app.js?v=3.0"></script>
</body>
</html>
