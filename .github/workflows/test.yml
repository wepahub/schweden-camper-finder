name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-Tests
        run: npm test
      - name: Lint
        run: npx --yes eslint@9 js tests service-worker.js
